# Roda a verificação do projeto a cada push e pull request.
# Se aparecer um X vermelho no GitHub, abra a aba "Actions" para ver o que faltou.
name: Verificar projeto

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Conferir sintaxe, arquivos, ícones e modo offline
        run: node scripts/check.mjs
