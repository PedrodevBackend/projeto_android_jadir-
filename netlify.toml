# EsgotoZero · configuração do Netlify
# O site é estático: não há etapa de build. O Netlify publica a pasta do projeto como ela está.

[build]
  publish = "."
  command = "node scripts/check.mjs"   # só confere o projeto antes de publicar (falha se faltar arquivo ou ícone)

# Cabeçalhos de segurança para todas as páginas
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(self), camera=(self), microphone=()"

# O manifesto do app precisa do tipo certo para o navegador oferecer "Instalar app"
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"

# O service worker nunca pode ficar preso em cache, senão as atualizações demoram a chegar
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
